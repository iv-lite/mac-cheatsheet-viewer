name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Publish a release with this version (e.g. 0.2.0). Leave empty for artifacts only.
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test the cheatsheet schema core
        run: cargo test -p cheatsheet-core

  release:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Stage web assets
        run: bash frontend/build.sh

      - name: Install Tauri CLI (prebuilt binary)
        run: npm install -D @tauri-apps/cli@2

      - name: Resolve release version and tag
        id: release-info
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_VERSION" ]]; then
            echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Sync app version
        if: steps.release-info.outputs.version != ''
        run: |
          VERSION="${{ steps.release-info.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          grep '"version"' src-tauri/tauri.conf.json

      - name: Build the app bundle
        run: npx tauri build --bundles app,dmg

      - name: Zip the app bundle
        run: |
          APP="target/release/bundle/macos/mac-cheatsheet-viewer.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/mac-cheatsheet-viewer.app.zip"
          ls -la "$RUNNER_TEMP/mac-cheatsheet-viewer.app.zip"

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mac-cheatsheet-viewer-macos
          path: |
            target/release/bundle/macos/*.dmg
            ${{ runner.temp }}/mac-cheatsheet-viewer.app.zip

      - name: Create GitHub Release
        if: steps.release-info.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: |
            target/release/bundle/macos/*.dmg
            ${{ runner.temp }}/mac-cheatsheet-viewer.app.zip